<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>London architecture · visual review</title>
<style>body{margin:0;background:#16282f;color:#e8eee6;font:14px system-ui}header{display:flex;flex-wrap:wrap;gap:14px;padding:14px;align-items:center}select,button{font:inherit;padding:8px;background:#253e49;color:#e8eee6;border:1px solid #647c80;border-radius:5px}canvas{display:block;width:100%;height:calc(100vh - 110px)}#status{margin-left:auto;color:#bbd79e}</style>
<header><strong>伦敦建筑 · 新地标与精修</strong><select id="landmark" aria-label="地标"></select><button id="detail">建筑细节</button><button id="drive">驾驶视角</button><button id="angle">另一侧</button><button id="forward">前移 100</button><button id="back">后移 100</button><button id="next">下一座 →</button><span id="status"></span></header><canvas id="view"></canvas>
<script type="module">
import {RaceEngine,setTrack,trackPoint,projectTrack} from '../engine.js';
import {RaceRenderer,londonLandmarkPlacements} from '../renderer.js';
import {LONDON_NEW_LANDMARKS} from '../london-new-landmarks.js';
import {LONDON_SECOND_LANDMARKS} from '../london-second-landmarks.js';
import {LONDON_THIRD_LANDMARKS} from '../london-third-landmarks.js';
import {WEST_END_LANDMARKS} from '../london-west-end.js';
import {ROYAL_LANDMARKS} from '../london-royal-landmarks.js';
import {LONDON_THEATRES} from '../london-theatres.js';
import {RIVERSIDE_LANDMARKS} from '../london-riverside-landmarks.js';
globalThis.__TWIN_TURBO_POSTERS__={mormon:'../assets/posters/book-of-mormon.jpg',wrong:'../assets/posters/play-that-goes-wrong.jpg',lion:'../assets/posters/lion-king.jpg'};
setTrack('coast-london');const canvas=document.getElementById('view'),engine=new RaceEngine(),renderer=new RaceRenderer(canvas,{sceneUrls:{coast:'../assets/coast.png',alpine:'../assets/alpine.png',city:'../assets/city.png',clouds:'../assets/cloud-sky.jpg'}});
renderer.setSinglePlayer(true);const carMeshes=[...renderer.meshes.cars,renderer.meshes.shadow];const carCounts=carMeshes.map(mesh=>mesh.count);const select=document.getElementById('landmark');
for(const landmark of [...LONDON_THIRD_LANDMARKS,...LONDON_SECOND_LANDMARKS,...LONDON_NEW_LANDMARKS,...WEST_END_LANDMARKS,...ROYAL_LANDMARKS,...RIVERSIDE_LANDMARKS,...LONDON_THEATRES,{kind:'big-ben',label:'Big Ben'},{kind:'london-eye',label:'London Eye'},{kind:'tower-bridge-tower',label:'Tower Bridge'}]){const option=document.createElement('option');option.value=landmark.kind;option.textContent=landmark.label;select.append(option);}
let detail=true,viewSide=-1,driveOffset=-280;function setup(){const source=londonLandmarkPlacements().find(item=>item.kind===select.value),item={...source,s:source.s??projectTrack(source.x,source.z).s,height:source.height??({'big-ben':380,'london-eye':418,'tower-bridge-tower':300}[source.kind])};engine.reset();carMeshes.forEach((mesh,i)=>mesh.count=detail?0:carCounts[i]);Object.assign(engine.cars[0],trackPoint(item.s+driveOffset),{speed:363});renderer.resetCameras(engine);if(detail){const c=Math.cos(item.angle),s=Math.sin(item.angle),p=(x,y,z)=>[item.x+c*x-s*z,y,item.z+s*x+c*z];const ahead=72+363/517*22,targetY=Math.max(65,item.height*.42);Object.assign(engine.cars[0],{x:item.x-c*ahead,y:item.z-s*ahead,angle:item.angle,elevation:targetY-13,slope:0});renderer.cameras[0]={carX:engine.cars[0].x,carY:engine.cars[0].y,angle:item.angle,eye:p(viewSide*item.radius*1.35,targetY+105,-Math.max(item.radius*2.85,item.height*1.65)),target:p(0,targetY,0),fov:52*Math.PI/180};}document.getElementById('status').textContent=renderer.available?(detail?'建筑细节':'实际跟车镜头'):renderer.error;}
document.getElementById('angle').onclick=()=>{viewSide*=-1;detail=true;setup();};document.getElementById('forward').onclick=()=>{detail=false;driveOffset+=100;setup();};document.getElementById('back').onclick=()=>{detail=false;driveOffset-=100;setup();};document.getElementById('next').onclick=()=>{select.selectedIndex=(select.selectedIndex+1)%select.options.length;setup();};select.onchange=()=>{driveOffset=-280;setup();};document.getElementById('detail').onclick=()=>{detail=true;setup();};document.getElementById('drive').onclick=()=>{detail=false;setup();};setup();
function frame(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight;renderer.render(engine,0,0);requestAnimationFrame(frame);}frame();
</script></html>
