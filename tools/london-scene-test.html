<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>London · 场景与物理验收</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101921;color:#e6edf2;font:14px system-ui,sans-serif}header{display:flex;gap:12px;align-items:center;padding:14px 18px;background:#1c2a34;flex-wrap:wrap}h1{font-size:18px;margin:0 12px 0 0}select,button{font:inherit;background:#283c49;color:inherit;border:1px solid #526875;border-radius:6px;padding:9px 12px}button{cursor:pointer}button:hover{background:#3b5260}label{white-space:nowrap}#status{padding:8px 18px;color:#a9c8d8}#viewport{position:relative;height:70vh;min-height:420px;margin:0 18px}canvas{display:block;width:100%;height:100%;background:#a9c2d0}#divider{position:absolute;left:50%;height:100%;width:2px;background:#e3edef88;top:0;pointer-events:none}#stats{padding:12px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}#stats>div{background:#1b2a34;padding:10px;border-radius:6px}p,details{margin:8px 18px;color:#a9c8d8}pre{white-space:pre-wrap;max-height:220px;overflow:auto;font-size:12px}strong{color:#d6f976}.error{color:#ff9b8d!important}
</style>
<header><h1>伦敦场景验收</h1><select id="location" aria-label="检查位置"></select><button id="previous">上一个</button><button id="next">下一个</button><button id="back">后退 20m</button><button id="forward">前进 20m</button><label><input id="look-at" type="checkbox">看向地标</label><label><input id="driving" type="checkbox">启动车辆</label><label><input id="ai" type="checkbox">双 AI 驾驶</label></header>
<div id="status" role="status">正在构建真实道路和场景…</div>
<div id="viewport"><canvas id="scene" aria-label="伦敦双视角验收画面"></canvas><div id="divider"></div></div>
<div id="stats"><div id="position">坐标</div><div id="street">街道</div><div id="performance">渲染</div><div id="collision">碰撞异常：尚未检查</div></div>
<p><button id="verify-race">验证双车完整比赛</button> <button id="check">扫描全圈行车线（窄门居中）</button> <button id="export-obstacles">导出场景障碍 JSON</button> <button id="export-report">导出检查报告</button></p>
<p>纯本地验收，不连接排行榜。WASD / 方向键驾驶；左 Shift / Enter 氮气。场景和碰撞均来自正式 CityRenderer。</p>
<details><summary>检查报告</summary><pre id="report" aria-live="polite">未运行</pre></details>
<script>globalThis.TWIN_SCENE_ART={'london-plane-tree':'../assets/london-plane-tree.png'};</script>
<script src="./london-scene-test.bundle.js"></script>
</html>
