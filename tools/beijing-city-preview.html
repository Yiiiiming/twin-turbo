<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北京 · 23 座地标验收</title>
<style>body{margin:0;background:#172d31;color:#eceddf;font:14px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,button,input{font:inherit;padding:8px;background:#29454a;color:#e9e9d9;border:1px solid #6d8582;border-radius:6px}canvas{display:block;width:100%;height:calc(100vh - 74px)}#status{color:#cce08f}</style>
<header><b>北京 · 街区布局验收</b><select id="landmark" aria-label="北京地标"></select><button id="detail">建筑细节</button><button id="drive">实际驾驶视角</button><button id="closer">近看立面</button><select id="route" aria-label="沿途位置"><option value="">沿途位置…</option></select><button id="tour">整圈巡游</button><span id="status"></span></header><canvas id="view"></canvas>
<script type="module">
import{TRACK,setTrack,RaceEngine,trackPoint}from'../engine.js';
import{RaceRenderer}from'../renderer.js';
import{cityLandmarkPlacements}from'../city-scenery.js';
import{BEIJING_LANDMARKS,BEIJING_REFINEMENTS}from'../beijing-city-landmarks.js';
setTrack('coast-beijing');const canvas=document.getElementById('view'),select=document.getElementById('landmark'),status=document.getElementById('status');
const engine=new RaceEngine(),renderer=new RaceRenderer(canvas,{sceneUrls:{coast:'../assets/coast.png',alpine:'../assets/alpine.png',city:'../assets/city.png',clouds:'../assets/cloud-sky.jpg'}});renderer.setSinglePlayer(true);if(!renderer.available){status.textContent=renderer.error;throw new Error(renderer.error);}
const models=[...BEIJING_REFINEMENTS,...BEIJING_LANDMARKS],meshes=[...renderer.meshes.cars,renderer.meshes.shadow],counts=meshes.map(m=>m.count);let mode='drive',tour=false,tourS=0,last=0;
const route=document.getElementById('route');for(let i=0;i<20;i++){const o=document.createElement('option');o.value=String(i/20);o.textContent=`赛程 ${i*5}%`;route.append(o);}
route.onchange=()=>{if(route.value==='')return;tour=false;mode='drive';engine.reset();meshes.forEach((m,i)=>m.count=counts[i]);tourS=TRACK.startDistance+Number(route.value)*TRACK.length;Object.assign(engine.cars[0],trackPoint(tourS),{speed:363});renderer.resetCameras(engine);status.textContent=`沿途 ${Math.round(Number(route.value)*100)}% · 标准跟车相机`;};
document.getElementById('tour').onclick=()=>{tour=!tour;mode='drive';meshes.forEach((m,i)=>m.count=counts[i]);if(tour){engine.reset();tourS=TRACK.startDistance;renderer.resetCameras(engine);}document.getElementById('tour').textContent=tour?'暂停巡游':'整圈巡游';};
for(const m of models){const opt=document.createElement('option');opt.value=m.kind;opt.textContent=m.label;select.append(opt);}
function setup(){tour=false;document.getElementById('tour').textContent='整圈巡游';const meta=models.find(m=>m.kind===select.value),raw=cityLandmarkPlacements().find(p=>p.kind===meta.kind),item={...raw,...meta,angle:raw.angle+(BEIJING_REFINEMENTS.includes(meta)&&raw.side<0?Math.PI:0)};engine.reset();meshes.forEach((m,i)=>m.count=mode==='drive'?counts[i]:0);
 Object.assign(engine.cars[0],trackPoint(raw.s-430),{speed:363});renderer.resetCameras(engine);
 if(mode!=='drive'){const c=Math.cos(item.angle),s=Math.sin(item.angle),p=(x,y,z)=>[item.x+c*x-s*z,y,item.z+s*x+c*z],targetY=Math.max(40,item.height*.42),ahead=72+363/517*22;Object.assign(engine.cars[0],{x:item.x-c*ahead,y:item.z-s*ahead,angle:item.angle,elevation:targetY-13,slope:0});renderer.cameras[0]={carX:engine.cars[0].x,carY:engine.cars[0].y,angle:item.angle,eye:p(-item.radius*(mode==='closer'?.35:1.2),targetY+Math.max(item.height*.28,item.radius*.65),-Math.max(item.radius*(mode==='closer'?2.1:3.6),item.height*1.45)),target:p(0,targetY,0),fov:52*Math.PI/180};}
 status.textContent=renderer.available?`${meta.label} · ${mode==='drive'?'标准跟车相机':'建筑细节'} · 赛道未改`:renderer.error;}
select.onchange=setup;for(const id of['detail','drive','closer'])document.getElementById(id).onclick=()=>{mode=id;setup();};setup();function frame(now){const dt=Math.min(.05,(now-(last||now))/1000);last=now;if(tour){tourS+=363*dt;Object.assign(engine.cars[0],trackPoint(tourS),{speed:363});status.textContent=`整圈巡游 · ${Math.floor(((tourS-TRACK.startDistance)%TRACK.length)/TRACK.length*100)}% · 标准跟车相机`;}canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight;renderer.render(engine,tour?dt:0,0);requestAnimationFrame(frame);}frame();
</script></html>
