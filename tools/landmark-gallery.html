<!doctype html><html lang="en"><head><meta charset="utf-8"><title>London landmark model review</title><style>body{margin:0;background:#1c2630;color:#eee;font:14px system-ui}header{padding:18px 28px;display:flex;align-items:center;gap:25px}h1{font-size:19px;margin:0}#models{margin:auto;width:1360px;display:grid;grid-template-columns:repeat(4,340px);position:relative}article{height:295px;position:relative;z-index:1;pointer-events:none}article span{position:absolute;bottom:12px;left:15px;font-size:12px;color:#17242b;background:#ffffffaf;padding:4px 8px;border-radius:4px}canvas{position:absolute;top:0;left:0}select{font:inherit;padding:6px}#status{color:#99bdc1}</style></head><body><header><h1>London · architectural model studies</h1><label for="select">Landmark</label><select id="select"><option value="all">All landmarks</option></select><span id="status">Loading</span></header><div id="models"></div><script type="module">
import * as T from '../vendor/three.module.js';import{createLandmark,LANDMARK_IDS}from'../city-landmarks.js';
const host=document.querySelector('#models'),select=document.querySelector('#select');
for(const id of LANDMARK_IDS){const o=document.createElement('option');o.value=id;o.textContent=id;select.append(o);}
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.outputColorSpace=T.SRGBColorSpace;host.append(renderer.domElement);
const models=new Map(LANDMARK_IDS.map(id=>[id,createLandmark(id)]));
function draw(){for(const n of host.querySelectorAll('article'))n.remove();const ids=select.value==='all'?LANDMARK_IDS:[select.value],single=ids.length===1,w=single?1360:340,h=single?1040:295,rows=Math.ceil(ids.length/(single?1:4));renderer.setSize(1360,rows*h);host.style.height=rows*h+'px';renderer.setScissorTest(true);let tris=0;ids.forEach((id,i)=>{const model=models.get(id),scene=new T.Scene();scene.background=new T.Color('#bdc9cb');scene.add(model);scene.add(new T.HemisphereLight('#e7f4ff','#817160',2.6));const sun=new T.DirectionalLight('#ffedcf',3.1);sun.position.set(-50,140,100);scene.add(sun);const size=model.userData,max=Math.max(size.width,size.depth,size.height);const camera=new T.PerspectiveCamera(37,w/h,.1,max*15);camera.position.set(max*.74,size.height*.48+max*.58,max*1.9);camera.lookAt(0,size.height*.43,0);const ground=new T.Mesh(new T.PlaneGeometry(max*5,max*5),new T.MeshStandardMaterial({color:'#a2adaa',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.04;scene.add(ground);const x=single?0:i%4*w,y=rows*h-(Math.floor(i/(single?1:4))+1)*h;renderer.setViewport(x,y,w,h);renderer.setScissor(x,y,w,h);renderer.render(scene,camera);tris+=renderer.info.render.triangles;const label=document.createElement('article');if(single)label.style.width='1360px';const name=document.createElement('span');name.textContent=id;label.append(name);host.append(label);});document.querySelector('#status').textContent=ids.length+' models · '+tris.toLocaleString()+' visible triangles';}select.addEventListener('change',draw);draw();
</script></body></html>
